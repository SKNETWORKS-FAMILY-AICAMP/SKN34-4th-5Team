  /api/auth/password:
    post:
      operationId: auth_password_create
      description: |-
        사용자 비밀번호를 변경합니다.
        Url: POST /auth/password
        Query (이메일 재설정): uid, token
        Headers (로그인 상태): Authorization: Bearer <access_token>
        Args:
            - current_password: 기존 비밀번호 (로그인 상태에서 필수)
            - new_password: 새 비밀번호
            - new_password_confirm: 새 비밀번호 확인
        기존 old_password, password, re_password 필드명도 지원합니다.
        Return: HTTP_200_OK
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/password/request:
    post:
      operationId: auth_password_request_create
      description: |-
        사용자 비밀번호 재설정 url 을 이메일로 전송합니다.
        Url: /api/auth/password/request
        Args:
            - email
        Return:
            - HTTP_200_OK
        1. 검증
        2. 비밀번호 재설정용 토큰 발급
        3. 이메일 전송
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmail'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/signin:
    post:
      operationId: auth_signin_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
