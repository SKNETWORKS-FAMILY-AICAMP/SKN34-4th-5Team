components:
  schemas:
    ActionEnum:
      enum:
      - directions
      type: string
      description: '* `directions` - directions'
    AdminMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - id
      - is_active
      - is_staff
      - is_superuser
      - username
    AthleteData:
      type: object
      properties:
        fetchedAt:
          type: string
          format: date-time
        providerFetchedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        source:
          $ref: '#/components/schemas/Source'
        stale:
          type: boolean
        warning:
          type: string
          nullable: true
        profile:
          type: object
          additionalProperties: {}
        seasonTitle:
          type: string
        seasonRecords:
          type: array
          items:
            type: object
            additionalProperties: {}
        careerTitle:
          type: string
        careerColumns:
          type: array
          items:
            type: object
            additionalProperties: {}
        careerRows:
          type: array
          items:
            type: object
            additionalProperties: {}
        collecting:
          type: boolean
        progress:
          $ref: '#/components/schemas/DetailProgress'
      required:
      - careerColumns
      - careerRows
      - careerTitle
      - collecting
      - fetchedAt
      - lastSyncedAt
      - profile
      - progress
      - providerFetchedAt
      - seasonRecords
      - seasonTitle
      - source
      - stale
      - updatedAt
      - warning
    AthleteResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/AthleteData'
          nullable: true
        error:
          type: string
          nullable: true
        code:
          type: string
      required:
      - data
      - error
    BaseballError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        references:
          type: object
          additionalProperties:
            type: integer
      required:
      - code
      - field_errors
      - message
    BlankEnum:
      enum:
      - ''
    BoardEnum:
      enum:
      - free
      - teams
      type: string
      description: |-
        * `free` - free
        * `teams` - teams
    ChatCheckpointEvent:
      type: object
      properties:
        turn_id:
          type: string
          format: uuid
        receipt:
          type: string
      required:
      - receipt
      - turn_id
    ChatCoursePayload:
      type: object
      properties:
        title:
          type: string
        stadium:
          type: string
        content:
          type: string
        contentFormat:
          oneOf:
          - $ref: '#/components/schemas/ContentFormatEnum'
          - $ref: '#/components/schemas/BlankEnum'
        duration:
          type: string
        tags:
          type: array
          items:
