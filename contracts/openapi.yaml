openapi: 3.0.3
info:
  title: KBO Journey API
  version: 1.0.0
paths:
  /api/auth/admin/members/:
    get:
      operationId: auth_admin_members_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminMemberList'
          description: ''
  /api/auth/admin/members/{id}/role/:
    patch:
      operationId: auth_admin_members_role_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - is_staff
              properties:
                is_staff:
                  type: boolean
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMember'
          description: ''
