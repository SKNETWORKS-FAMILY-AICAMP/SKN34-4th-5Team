name: Production Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluation-regression:
    uses: ./.github/workflows/evaluation-regression.yml

  # 1. CI 검증
  ci-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Next.js build
        working-directory: frontend
        run: npm run build

  # 2. 이미지 빌드 및 운영 배포
  deploy:
    needs: [ci-test, evaluation-regression]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # EC2가 아닌 GitHub Actions에서 이미지 빌드
      - name: Build production images
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail

          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=prod-backend \
            --cache-to type=gha,mode=max,scope=prod-backend \
            -f backend/Dockerfile.prod \
            -t dev-backend:latest \
            backend

          docker tag dev-backend:latest dev-lodging-warmer:latest

          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=prod-frontend \
            --cache-to type=gha,mode=max,scope=prod-frontend \
            -f frontend/Dockerfile.prod \
            --build-arg YOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
            -t dev-frontend:latest \
            frontend

          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=prod-jev-browser \
            --cache-to type=gha,mode=max,scope=prod-jev-browser \
            -f docker/jev-browser/Dockerfile \
            -t dev-jev-browser:latest \
            docker/jev-browser

          docker save \
            dev-backend:latest \
            dev-lodging-warmer:latest \
            dev-frontend:latest \
            dev-jev-browser:latest \
            | gzip -1 > "$RUNNER_TEMP/production-images.tar.gz"

          ls -lh "$RUNNER_TEMP/production-images.tar.gz"

      # SSH 설정
      - name: Configure SSH for image transfer
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/prod_ec2
          chmod 600 ~/.ssh/prod_ec2

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 배포 전 운영 서버 정리
      - name: Clean up production EC2 before image transfer
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          SSH="ssh -i ~/.ssh/prod_ec2 -o BatchMode=yes -o StrictHostKeyChecking=yes"

          # 이전 배포의 임시 이미지 파일 제거
          $SSH "$EC2_USER@$EC2_HOST" \
            'rm -f ~/production-images.tar.gz'

          # 미사용 이미지 정리
          $SSH "$EC2_USER@$EC2_HOST" \
            'docker container prune -f && docker image prune -af && docker builder prune -af --filter until=24h || true'

          # 미사용 익명 볼륨 정리
          # 명명된 볼륨은 일반 prune에서 제외됨
          $SSH "$EC2_USER@$EC2_HOST" \
            'docker volume prune -f'

          # 정리 결과 확인
          $SSH "$EC2_USER@$EC2_HOST" \
            'echo "===== 배포 전 디스크 상태 =====" &&
             df -h &&
             df -i &&
             docker system df -v'

      # 이미지 압축 파일 전송
      - name: Transfer production images to EC2
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          scp -i ~/.ssh/prod_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/production-images.tar.gz" \
            "$EC2_USER@$EC2_HOST:production-images.tar.gz"

      # 운영 배포
      - name: Deploy to production EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m

          script: |
            set -eu

            cd ~/dev

            echo "===== 운영 서버 사전 점검 ====="
            df -h
            df -i
            docker system df -v

            # 최신 main 코드 반영
            echo "===== Git 업데이트 ====="
            git fetch origin main
            git merge --ff-only origin/main

            # 전달받은 이미지 로드
            echo "===== 운영 이미지 로드 ====="
            docker load -i ~/production-images.tar.gz
            rm -f ~/production-images.tar.gz

            # 기존 Mailpit 중지
            docker compose -p dev \
              -f docker-compose.prod.yml \
              stop mailpit || true

            # 운영 서비스 배포
            echo "===== 운영 서비스 배포 ====="
            docker compose \
              -p dev \
              -f docker-compose.prod.yml \
              up -d --no-build --force-recreate --wait --wait-timeout 240 \
              backend frontend nginx minio jev-browser lodging-warmer community-moderation-worker

            # 이미지 교체 중 생성된 이전 레이어를 즉시 제거해 30GiB 디스크를 보호
            docker image prune -af
            docker builder prune -af --filter until=24h || true

            # Nginx 설정 검증
            echo "===== Nginx 설정 검증 ====="
            docker compose \
              -p dev \
              -f docker-compose.prod.yml \
              exec -T nginx nginx -t

            # 헬스 체크
            echo "===== 운영 헬스 체크 ====="

            wait_for_endpoint() {
              endpoint=$1
              attempt=1
              max_attempts=30

              while [ "$attempt" -le "$max_attempts" ]; do
                if curl --fail --silent --show-error --insecure \
                  --connect-timeout 2 --max-time 10 \
                  --output /dev/null "$endpoint"; then
                  echo "Healthy: $endpoint"
                  return 0
                fi

                echo "Waiting for endpoint ($attempt/$max_attempts): $endpoint"

                if [ "$attempt" -lt "$max_attempts" ]; then
                  sleep 2
                fi

                attempt=$((attempt + 1))
              done

              echo "Endpoint did not become healthy: $endpoint" >&2
              docker compose -p dev \
                -f docker-compose.prod.yml \
                ps >&2 || true
              return 1
            }

            # 백엔드 직접 검사
            wait_for_endpoint http://127.0.0.1:8000/api/v1/healthz/

            # Nginx를 통한 API 및 프런트엔드 검사
            wait_for_endpoint https://localhost/api/v1/healthz/
            wait_for_endpoint https://localhost/

            # 배포와 헬스 체크 성공 이후 정리
            echo "===== 배포 후 Docker 정리 ====="

            docker volume prune -f
            docker container prune -f
            docker image prune -af
            docker builder prune -af --filter until=24h || true
            docker system prune -af

            # 최종 상태 확인
            echo "===== 최종 디스크 상태 ====="
            df -h
            df -i
            docker system df -v

            echo "===== 운영 서버 배포 완료 ====="

  # 3. 실패 시에만 Discord 알림
  notify-discord:
    needs: [ci-test, evaluation-regression, deploy]

    if: >-
      always() &&
      (
        needs.ci-test.result != 'success' ||
        needs.evaluation-regression.result != 'success' ||
        needs.deploy.result != 'success'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Send production deployment failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.ci-test.result }}
          EVALUATION_RESULT: ${{ needs.evaluation-regression.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          if [ "$CI_RESULT" != "success" ] || \
             [ "$EVALUATION_RESULT" != "success" ]; then
            STATUS="❌ [운영 CI 실패]"
            DETAILS="CI 검증 또는 회귀 테스트가 실패하거나 실행되지 않았습니다."
          else
            STATUS="❌ [운영 배포 실패]"
            DETAILS="운영 EC2 배포가 실패하거나 완료되지 않았습니다."
          fi

          ACTION_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE="**${STATUS}**
          • **Repository:** ${{ github.repository }}
          • **Branch:** ${GITHUB_REF_NAME}
          • **CI:** ${CI_RESULT}
          • **회귀 테스트:** ${EVALUATION_RESULT}
          • **배포:** ${DEPLOY_RESULT}
          • **상세 내용:** ${DETAILS}
          • **Action 링크:** ${ACTION_URL}"

          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
