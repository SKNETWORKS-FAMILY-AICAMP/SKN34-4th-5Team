name: Evaluation regression

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
  DEEPEVAL_DISABLE_DOTENV: '1'
  DEEPEVAL_DISABLE_LEGACY_KEYFILE: '1'
  PYTHON_DOTENV_DISABLED: '1'
  RAGAS_DO_NOT_TRACK: 'true'
  LANGSMITH_TRACING: 'false'
  LANGCHAIN_TRACING_V2: 'false'

jobs:
  provider-quality-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - name: Report distinct provider quality state (never a mock quality pass)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git -C trusted fetch origin "pull/$PR/head"
          test "$(git -C trusted rev-parse FETCH_HEAD)" = "$HEAD"
          git -C trusted diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/evaluation-paths"
          python -I - <<'PY'
          import os, pathlib
          paths=pathlib.Path(os.environ['RUNNER_TEMP']+'/evaluation-paths').read_text().splitlines()
          protected=any(p.startswith(('backend/llm/v2/evaluation/','.github/evaluation','.github/test_evaluation','.github/workflows/evaluation')) for p in paths)
          relevant=protected or any(not p.startswith(('frontend/','docs/','graphify-out/')) and p not in ('README.md','.gitignore') for p in paths)
          state='required/not-run; approved live A/B and user quality review required' if relevant else 'exempt/non-LLM'
          modes='jev,supervisor,ragas,highlight' if relevant else 'none'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(f'Provider quality: {state}; required modes: {modes}; protected review required: {protected}\n')
          if protected:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Protected criteria/cases/harness changed: explicit independent protected review required in quality decision\n')
          PY
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      highlight-db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: highlight_ci
          POSTGRES_USER: highlight_ci
          POSTGRES_PASSWORD: highlight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U highlight_ci -d highlight_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/llm/v2/evaluation/requirements.txt
      - name: Warm hash-verified tokenizer asset before offline tests
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/evaluation-tiktoken
        run: python -I -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
      - name: Full highlight Django regression (disposable PostgreSQL, no provider network)
        run: python -I .github/evaluation_ci.py offline-exec backend/manage.py test llm.tests.test_highlights --settings=llm.tests.highlight_settings --noinput --verbosity=2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Highlight title and API proxy frontend regression
        run: node --test tests/youtube-highlight.test.mjs tests/auth-bridge.test.mjs
        working-directory: frontend
      - name: Lodging collector URL and challenge regression
        run: node docker/jev-browser/test-direct-lodging.mjs
      - run: python -I .github/test_evaluation_ci.py
      - run: python -I .github/test_evaluation_ab.py
      - run: python -I .github/test_evaluation_luna.py LunaExportIntegrationTest
      - run: python -I .github/evaluation_ci.py free --output "$RUNNER_TEMP/evaluation-free"
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/evaluation-tiktoken
      - uses: actions/upload-artifact@v4
        with:
          name: course-contract-export
          path: ${{ runner.temp }}/evaluation-free/tonkatsu.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-free-summary
          path: ${{ runner.temp }}/evaluation-free/ci-summary.json
          retention-days: 7
  highlight-deterministic:
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r .github/requirements-highlight.txt
      - uses: actions/download-artifact@v4
        with:
          name: course-contract-export
          path: ${{ runner.temp }}/course-contract
      - name: Replay actual meal replacement contracts with Ragas (no provider calls)
        run: python -I .github/evaluation_ci.py offline-exec backend/llm/v2/evaluation/tonkatsu_contract.py score --input "$RUNNER_TEMP/course-contract/tonkatsu.json" --output "$RUNNER_TEMP/course-contract/ragas.json"
      - run: python -I .github/test_evaluation_luna.py LunaSDKTest
      - run: python -I .github/evaluation_ci.py highlight-free --output "$RUNNER_TEMP/highlight-free"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highlight-free-summary
          path: ${{ runner.temp }}/highlight-free/ci-summary.json
          retention-days: 7
