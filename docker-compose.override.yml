# Auto-selected by default local Compose; explicitly selected by deployment callers.
services:
  vector-init:
    image: dev-vector-init:latest
    build:
      context: .
      dockerfile: docker/vector-startup.Dockerfile
    restart: "no"
    depends_on:
      qdrant:
        condition: service_started
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
      QDRANT_DOCUMENT_COLLECTION: ${QDRANT_DOCUMENT_COLLECTION:-kbo_documents_openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      VECTOR_GDRIVE_URL: ${VECTOR_GDRIVE_URL:-https://drive.google.com/drive/folders/1PYIWVi_85-FW_Jsjz413IoAcDNxOvQqR}
    volumes:
      - vector_cache:/vector-cache
      - vector_runtime:/vector-runtime
  backend:
    depends_on:
      vector-init:
        condition: service_completed_successfully
    environment:
      HIGHLIGHT_MULTIMODAL_CORPUS: /vector-runtime/highlight-corpus
    volumes:
      - vector_runtime:/vector-runtime

volumes:
  vector_cache:
  vector_runtime:
