map "$request_method|$http_origin|$scheme://$http_host" $next_origin {
    default $http_origin;
    ~^(POST|PATCH|DELETE)\|\| "";
    ~^(POST|PATCH|DELETE)\|(https?://[^|]+)\|\2$ $http_origin;
    ~^(POST|PATCH|DELETE)\| invalid;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 21m;

    # Docker 내장 DNS를 사용해 컨테이너 IP 변경에 대응
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    proxy_http_version 1.1;

    # Next.js HMR
    location ~ ^/_next/(webpack-hmr|hmr) {
        set $upstream frontend:3000;
        proxy_pass http://$upstream;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 커뮤니티 이미지 업로드
    # 기존 URI 처리 방식 유지하면서 Docker DNS 재조회 적용
    location = /api/v1/community/images/ {
        client_max_body_size 6m;

        set $upstream backend:8000;
        proxy_pass http://$upstream/api/v1/community/images/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 채팅 및 스트리밍
    location /api/v2/chat/ {
        set $upstream backend:8000;
        proxy_pass http://$upstream;

        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # Backend API
    location /api/ {
        set $upstream backend:8000;
        proxy_pass http://$upstream;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        set $upstream frontend:3000;
        proxy_pass http://$upstream;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
